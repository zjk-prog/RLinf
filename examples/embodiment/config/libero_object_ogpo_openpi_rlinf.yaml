defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/pi0_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run: {dir: .}
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  execution_mode: sync
  use_training_pipeline: false
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: libero_object_ogpo_openpi_rlinf
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  loss_type: embodied_ogpo
  adv_type: raw
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  loss_agg_func: token-mean
  clip_ratio_low: 0.01
  clip_ratio_high: 0.01
  entropy_bonus: 0.0
  group_size: 8
  update_epoch: 8
  gamma: 0.99
  replay_buffer:
    enable_cache: true
    cache_size: 1000000
    sample_window_size: 1000000
    min_buffer_size: 4
    auto_save: false
    save_buffer_checkpoint: false
  ogpo:
    replay_mode: openpi_chunk
    critic_only: false
    # Runner global steps (TensorBoard steps), independent of update_epoch/q_utd.
    q_warmup_steps: 50
    q_utd: 4
    pi_utd: 1
    actor_tau: 0.005
    critic_tau: 0.05
    actor_target_update_freq: 1
    critic_target_update_freq: 1
    td_q_aggregation: mean
    td_q_subsample_size: 2
    advantage_q_strategy: conservative  # conservativevanilla
    normalize_group: true
    advantage_min: null
    bc_coeff: 0.0
    min_success_chunks: 1
    use_success_buffer_q: false

env:
  group_name: EnvGroup
  train:
    specific_reset_id: 0
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    rollout_epoch: 1
    total_num_envs: 32
    auto_reset: true
    ignore_terminations: false
    use_only_first_success: true
    use_rel_reward: false
    use_step_penalty: false
    reset_gripper_open: true
    video_cfg:
      save_video: false
    skip_intermediate_renders: false
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
  eval:
    specific_reset_id: 0
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: true
    ignore_terminations: false
    skip_intermediate_renders: false
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: true
    single_trajectory_per_env: true
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  collect_prev_infos: false
  collect_transitions: false
  model:
    model_path: /mnt/public2/zjk/ogpo/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 256
  seed: 42
  enable_offload: true
  model:
    model_type: openpi_rlinf
    precision: null
    model_path: ${rollout.model.model_path}
    num_action_chunks: 5
    action_dim: 7
    num_q_heads: 10
    add_value_head: false
    num_steps: 4
    openpi:
      task: ogpo
      config_name: pi0_libero
      action_horizon: 50
      noise_method: flow_sde
      noise_level: 0.5
      # PPO semantics: one randomly chosen noisy step; all other steps use ODE.
      # Setting joint_logprob=true noises every step and averages step log-probs.
      joint_logprob: false
      # If true and joint_logprob=false, exclude the final step from selection.
      ignore_last: false
      action_chunk: 5
      action_env_dim: 7
      model_action_dim: 32
      num_images_in_input: 2
      train_expert_only: true
      critic_gemma3:
        hidden_size: 384
        intermediate_size: 768
        num_hidden_layers: 3
        num_attention_heads: 2
        num_key_value_heads: 1
        head_dim: 192
      critic_mlp_hidden_dims: [128, 64]
  optim:
    lr: 5.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
  critic_optim:
    lr: 5.0e-5
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null

reward:
  use_reward_model: false
critic:
  use_critic_model: false
