# realworld_franka_eval_dreamzero.yaml
# DreamZero evaluation/deployment on real Franka arm.
# This config is the realworld counterpart of libero_spatial_eval_dreamzero.yaml.

defaults:
  - env/realworld_bin_relocation@env.train
  - env/realworld_bin_relocation@env.eval
  - model/dreamzero@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: "4090"
      placement: 0 # Local GPU rank in the 4090 node group (n for the n+1 th GPU)
    env:
      node_group: franka
      placement: 0 # Local robot rank in the franka node group (n for the n+1 th robot)
    rollout:
      node_group: "4090"
      placement: 0 # Local GPU rank in the 4090 node group (n for the n+1 th GPU)
  node_groups:
    - label: "4090" # GPU node group
      node_ranks: 0 # The ranks of the nodes to be included in this group, change this if your training node is not rank 0
    - label: franka
      node_ranks: 1 # Change this if your robot node is not rank 1
      hardware:
        type: Franka
        configs:
          - robot_ip: 192.168.1.2 # Replace with your robot's IP address
            node_rank: 1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "realworld_franka_eval_dreamzero"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: 1
  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  # ckpt_path: /home/shiliangzhi/work-space/wyt/deploy_dz/ckpt_pnp/dreamzero-franka/full_weights.pt

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 20

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 5
  adv_type: gae
  loss_type: actor_critic

  gamma: 0.99
  gae_lambda: 0.95
  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 1
    auto_reset: False
    ignore_terminations: False
    keyboard_reward_wrapper: null
    use_spacemouse: False
    no_gripper: False
    max_steps_per_rollout_epoch: 240
    max_episode_steps: 240
    override_cfg:
      task_description: "pick up the object and place it into the container"
      target_ee_pose: [0.5, 0.0, 0.1, -3.14, 0.0, 0.0]
      reset_ee_pose: [0.5, 0.0, 0.2, -3.14, 0.0, 0.0]
      enable_camera_player: True

  eval:
    ignore_terminations: False
    keyboard_reward_wrapper: null
    no_gripper: False
    use_spacemouse: False
    total_num_envs: 1
    main_image_key: wrist_1
    max_steps_per_rollout_epoch: 192
    max_episode_steps: 192
    override_cfg:
      is_dummy: False
      # Keep full realworld proprio state (e.g. 19D after wrappers).
      use_dense_reward: False
      max_num_steps: 192
      target_ee_pose: [ 0.68890358,  0.10072748, -0.04299118,  3.05971374, -0.08385753 ,-0.038867  ]
      camera_serials: ['141722075170', '233622072915']
      # camera_serials: ['141722075170']
      # DreamZero metadata uses (H, W) for video resolution [176, 320].
      camera_frame_height: 176
      camera_frame_width: 320
      binary_gripper_threshold: 0.5
      gripper_action_mode: zero_one
      enable_gripper_penalty: False
      enable_camera_player: True
      
    data_collection:
      # Set to False if you only want metrics and do not need to export episodes.
      enabled: True
      save_dir: "/home/abc/wangyitao/RLinf/logs/pnp_eval_14B_0519" # Directory to save evaluation data
      export_format: "lerobot"
      only_success: False
      
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: False
  sync_weight_nccl_max_ctas: 32

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 0
  enable_offload: False

  model:
    model_type: "dreamzero"
    # DreamZero model directory containing config.json, experiment_cfg/, and model.safetensors (or sharded safetensors).
    # model_path: "/home/shiliangzhi/work-space/wyt/deploy_dz/ckpt_pnp/dreamzero-franka-0509"
    model_path: "/home/shiliangzhi/work-space/wyt/deploy_dz/ckpt_pnp/hf_model"
    # model_path: "/home/shiliangzhi/work-space/wyt/deploy_dz/ckpt_pnp/dreamzero-franka"
    tokenizer_path: "/home/shiliangzhi/work-space/wyt/deploy_dz/umt5-xxl"

    action_dim: 7
    # Force policy-side gripper action convention: 0=close, 1=open.
    gripper_action_mode: zero_one
    # Must match the model action horizon (check model_path/config.json: action_horizon).
    num_action_chunks: 8
    # Must exist in model_path/experiment_cfg/metadata.json.
    embodiment_tag: "real_panda_single_arm"
    is_lora: False
    max_seq_len: 512
    add_value_head: True
    precision: bf16

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False